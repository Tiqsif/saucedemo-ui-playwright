[pytest]
# used to set base_url here and let pytest-playwright handle it, but that
# turned out to be unreliable once xdist and multiple browsers ran
# together, some workers never got it applied. base_page.py builds the
# full url itself now instead, so nothing here needs to set it
testpaths = tests
# this puts the project root on sys.path so "from pages.login_page import LoginPage"
# works from inside tests/, without this pytest only adds the tests/ folder
# itself to sys.path and the import breaks
pythonpath = .
# only keep evidence for tests that actually fail, a screenshot, a video,
# and a full playwright trace, so a failing ci run can be debugged after the fact
addopts = --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
