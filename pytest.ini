[pytest]
# saucedemo doesnt need auth or env vars like our other project did, its just
# a public demo site, so base_url is the only config we actually need
base_url = https://www.saucedemo.com
testpaths = tests
# this puts the project root on sys.path so "from pages.login_page import LoginPage"
# works from inside tests/, without this pytest only adds the tests/ folder
# itself to sys.path and the import breaks
pythonpath = .
